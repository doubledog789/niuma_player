group = "cn.niuma.niuma_player"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def niumaLocalMaven = file("${project.projectDir}/localmaven")
rootProject.allprojects { proj ->
    proj.repositories { maven { url = uri(niumaLocalMaven) } }
}

android {
    namespace = "cn.niuma.niuma_player"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
        // Propagate our JNI-safety rules into any app that uses this plugin
        // so release/minified builds don't SIGSEGV inside libijkplayer.so.
        consumerProguardFiles "consumer-rules.pro"
    }

    dependencies {
        // IJK 软解兜底改用 GSY 官方 MavenCentral 产物（bilibili ijkplayer
        // 0.8.8 血统 + FFmpeg 4.3 全量：h264/h265/mp4/hls 全支持，多年线上
        // 验证）。替换原自编 ShikinChen ff7.1 slim aar——后者在真机上连续
        // 踩中 fork 私货（show_first_frame seek(0) hack）与 2.5K 软解不出
        // 帧的问题，排障成本远超收益。体积：arm64 三件套约 7.5MB（比自编
        // slim 大 ~0.6MB，市面稳定产物中最小）。
        // - gsyvideoplayer-java：官方 ijkplayer-java（保留 tv.danmaku.ijk
        //   包名，API 与 IjkSession 完全兼容），依赖仅 androidx 基础件
        // - ex_so：含 hevc 的扩展版 so（标准版无 hevc）
        implementation("tv.danmaku.ijk:ijkplayer:0.8.8-ff8.1-static-20260727@aar")
    }
}
