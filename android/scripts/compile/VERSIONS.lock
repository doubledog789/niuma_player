# niuma_player IJK / FFmpeg 版本锁定
# 本文件为所有 android/localmaven/.../ijkplayer-*.aar 产物的唯一事实源。
# 任何版本变更都必须先改本文件，再改脚本。
#
# 2026-07-27: 升到 FFmpeg 8.1（上游 n8.1 + ijk 补丁移植），并修掉 fork 的三处
#   私货/旧假设。背景与实测数据见 doc/ijk-fmp4-hls.md。
#   - 0001 补丁（JNI OnLoad）必须打，否则 fMP4 完全不出帧
#   - 0002 补丁：FFmpeg 8 API 移植 + niuma 三处修复
#   - 0003 补丁：ijk 的 FFmpeg 侧补丁 rebase 到 n8.1

IJK_FORK=ShikinChen/ijkplayer-android
IJK_TAG=ijk0.8.8--ff7.1
IJK_COMMIT=1b61cbe52473f7abb3f4f2cd19e2359d22f8dde8
FFMPEG_UPSTREAM=FFmpeg/FFmpeg
FFMPEG_TAG=n8.1
FFMPEG_VERSION=8.1
# 库版本三元组：libavutil 60.26.100 / libavcodec 62.28.100 / libavformat 62.12.100
OPENSSL_VERSION=3.2
LIBYUV_COMMIT=ijk-r0.2.1-dev
SOUNDTOUCH_COMMIT=ijk-r0.1.2-dev

# 必打补丁（顺序）
PATCHES=patches/0001-fix-jni-onload-j4a-loadall-sdl-jvm.patch,patches/0002-ff8-port-and-niuma-fixes.patch
FFMPEG_PATCH=patches/0003-ijk-patches-on-ffmpeg-8.1.patch

# 双 NDK: 21 用 autotools 编 FFmpeg + OpenSSL；27 用 cmake 编 JNI .so
NDK_FFMPEG_REVISION=21.4.7075529
NDK_CMAKE_REVISION=27.0.12077973
COMPILE_SDK=35
TARGET_SDK=35
MIN_SDK=21
ABI=arm64-v8a,armeabi-v7a
FFMPEG_MODULE=modules/module-niuma-ff8-slim.sh
LICENSE=LGPL-2.1
FFMPEG_GPL=disabled
OPENSSL_LINK=static
AAR_VERSION=0.8.8-ff8.1-20260727

